    <text x="32" y="945" font-size="14" font-weight="normal" text-anchor="start" fill="#41585c">Wire = automatic startup composition. Dependency = source-level import. Sync = request-time method call on the injected object.</text>
    <text x="32" y="968" font-size="14" font-weight="normal" text-anchor="start" fill="#41585c">Registry, deployment, dataset and optional ingestion routers share this executable. Scientific training plugins execute on the training path.</text>
