n uncertain</text><rect x="131" y="755" width="300" height="102" rx="14" fill="#D2D9D9" stroke="none" stroke-width="0" opacity="0.28"/><rect x="130" y="751" width="300" height="102" rx="14" fill="#FFFFFF" stroke="#90AA98" stroke-width="1.6" /><rect x="131" y="752" width="8" height="100" rx="5" fill="#90AA98" stroke="none" stroke-width="1" /><text x="154" y="777" font-size="12" font-weight="650" fill="#668574" text-anchor="start" dominant-baseline="middle" letter-spacing="1.2">STATE</text><text x="154" y="804" font-size="19" font-weight="400" fill="#34434E" text-anchor="start" dominant-baseline="middle" >CANCELLED</text><text x="154" y="833" font-size="14" font-weight="400" fill="#6F7D86" text-anchor="start" dominant-baseline="middle" >Stop confirmed</text><rect x="501" y="755" width="300" height="102" rx="14" fill="#D2D9D9" stroke="none" stroke-width="0" opacity="0.28"/><rect x="500" y="751" width="300" height="102" rx="14" fill="#FFFFFF" stroke="#C39D9A" stroke-width="1.6" /><rect x="501" y="752" width="8" height="100" rx="5" fill="#C39D9A" stroke="none" stroke-width="1" /><text x="524" y="777" font-size="12" font-weight="650" fill="#9B7270" text-anchor="start" dominant-baseline="middle" letter-spacing="1.2">STATE</text><text x="524" y="804" font-size="19" font-weight="400" fill="#34434E" text-anchor="start" dominant-baseline="middle" >FAILED</text><text x="524" y="833" font-size="14" font-weight="400" fill="#6F7D86" text-anchor="start" dominant-baseline="middle" >Final failure</text><rect x="871" y="755" width="300" height="102" rx="14" fill="#D2D9D9" stroke="none" stroke-width="0" opacity="0.28"/><rect x="870" y="751" width="300" height="102" rx="14" fill="#FFFFFF" stroke="#90AA98" stroke-width="1.6" /><rect x="871" y="752" width="8" height="100" rx="5" fill="#90AA98" stroke="none" stroke-width="1" /><text x="894" y="777" font-size="12" font-weight="650" fill="#668574" text-anchor="start" dominant-baseline="middle" letter-spacing="1.2">STATE</text><text x="894" y="804" font-size="19" font-weight="400" fill="#34434E" text-anchor="start" dominant-baseline="middle" >SUCCEEDED</text><text x="894" y="833" font-size="14" font-weight="400" fill="#6F7D86" text-anchor="start" dominant-baseline="middle" >Committed output refs</text><rect x="1374" y="308" width="425" height="126" rx="13" fill="#FFFFFF" stroke="#94A5AE" stroke-width="1.1" /><text x="1394" y="338" font-size="19" font-weight="650" fill="#34434E" text-anchor="start" dominant-baseline="middle" >01 / Idempotency</text><text x="1394" y="366" font-size="16" font-weight="400" fill="#6F7D86" text-anchor="start" dominant-baseline="middle" >Same scoped key + same intent</text><text x="1394" y="390" font-size="16" font-weight="400" fill="#6F7D86" text-anchor="start" dominant-baseline="middle" >→ same logical job.</text><rect x="1374" y="459" width="425" height="126" rx="13" fill="#FFFFFF" stroke="#94A5AE" stroke-width="1.1" /><text x="1394" y="489" font-size="19" font-weight="650" fill="#34434E" text-anchor="start" dominant-baseline="middle" >02 / Atomic Claim</text><text x="1394" y="517" font-size="16" font-weight="400" fill="#6F7D86" text-anchor="start" dominant-baseline="middle" >At most one active owner;</text><text x="1394" y="541" font-size="16" font-weight="400" fill="#6F7D86" text-anchor="start" dominant-baseline="middle" >late writes rejected by revision.</text><rect x="1374" y="610" width="425" height="126" rx="13" fill="#FFFFFF" stroke="#94A5AE" stroke-width="1.1" /><text x="1394" y="640" font-size="19" font-weight="650" fill="#34434E" text-anchor="start" dominant-baseline="middle" >03 / Cancel Safety</text><text x="1394" y="668" font-size="16" font-weight="400" fill="#6F7D86" text-anchor="start" dominant-baseline="middle" >Cancellation is not complete</text><text x="1394" y="692" font-size="16" font-weight="400" fill="#6F7D86" text-anchor="start" dominant-baseline="middle" >until process stop is confirmed.</text><rect x="1374" y="761" width="425" height="126" rx="13" f