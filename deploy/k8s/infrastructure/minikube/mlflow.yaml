apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
spec:
  selector:
    app.kubernetes.io/name: mlflow
  ports:
  - name: tcp
    port: 8443
    targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        ml-system/stage: infrastructure
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
      - name: mlflow
        image: ml-system-mlflow:unconfigured
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1536Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        - name: MLFLOW_BACKEND_STORE_URI
          valueFrom:
            secretKeyRef:
              name: ml-infra
              key: MLFLOW_BACKEND_STORE_URI
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: ml-infra
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: ml-infra
              key: AWS_SECRET_ACCESS_KEY
        - name: MLFLOW_FLASK_SERVER_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ml-infra
              key: MLFLOW_FLASK_SERVER_SECRET_KEY
        - name: MLFLOW_S3_ENDPOINT_URL
          value: http://minio:9000
        - name: MLFLOW_AUTH_CONFIG_PATH
          value: /auth/basic_auth.ini
        args:
        - --app-name
        - basic-auth
        - --allowed-hosts
        - mlflow:8443,mlflow:5000,localhost:5000,127.0.0.1:5000
        - --workers
        - '1'
        volumeMounts:
        - name: mlflow
          mountPath: /auth-data
        - name: mlflow-auth
          mountPath: /auth
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 12
      - name: tls
        image: nginx:1.28-alpine
        ports:
        - containerPort: 8443
        command:
        - nginx
        - -g
        - daemon off;
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: mlflow-tls
          mountPath: /tls
          readOnly: true
        - name: proxy-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: proxy-tmp
          mountPath: /tmp
        readinessProbe:
          tcpSocket:
            port: 8443
          periodSeconds: 5
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
      volumes:
      - name: mlflow
        persistentVolumeClaim:
          claimName: mlflow
      - name: mlflow-auth
        secret:
          secretName: mlflow-auth
      - name: mlflow-tls
        secret:
          secretName: mlflow-tls
      - name: proxy-config
        configMap:
          name: mlflow-proxy
      - name: proxy-tmp
        emptyDir: {}
