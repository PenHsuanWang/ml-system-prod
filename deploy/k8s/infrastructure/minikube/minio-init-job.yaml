# Git-managed declaration; credentials are supplied outside Git.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-init
        ml-system/stage: infrastructure
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: initialize
        image: ml-system-mc:unconfigured
        command:
        - /bin/sh
        - -ec
        args:
        - for attempt in $(seq 1 60); do if mc alias set internal http://minio:9000
          "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && mc mb --ignore-existing
          internal/ml-artifacts >/dev/null 2>&1; then exit 0; fi; sleep 2; done; exit
          1
        env:
        - name: MINIO_ROOT_USER
          value: ml-artifacts
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ml-infra
              key: MINIO_ROOT_PASSWORD
        - name: MC_CONFIG_DIR
          value: /tmp/mc
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
