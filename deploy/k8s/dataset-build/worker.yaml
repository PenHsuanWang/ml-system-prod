apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-dataset-build-worker
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-dataset-build-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ml-dataset-build-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ml-dataset-build-worker
        app.kubernetes.io/part-of: ml-system
    spec:
      serviceAccountName: ml-dataset-build-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: prepare-dataset-build-worker
        image: ml-system-runtime:unconfigured
        imagePullPolicy: IfNotPresent
        command: [python, /foundation/prepare_runtime.py]
        envFrom:
        - configMapRef:
            name: ml-runtime
        env:
        - name: ML_RUNTIME_ROLE
          value: dataset-build-worker
        - name: ML_WAIT_FOR_SCHEMA
          value: 'true'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: runtime
          mountPath: /app/var/executions
          subPath: executions
        - name: foundation
          mountPath: /foundation
          readOnly: true
        - name: dataset-build-source
          mountPath: /projected/role
          readOnly: true
        - name: ca-source
          mountPath: /projected/ca
          readOnly: true
        - name: private
          mountPath: /run/private
        - name: tmp
          mountPath: /tmp
      containers:
      - name: dataset-build-worker
        image: ml-system-runtime:unconfigured
        imagePullPolicy: IfNotPresent
        command: [python, -m, bootstrap.deployment_entrypoint]
        args: [python, -m, bootstrap.dataset_build_worker]
        envFrom:
        - configMapRef:
            name: ml-runtime
        env:
        - name: ML_RUNTIME_ROLE
          value: dataset-build-worker
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 256Mi
          limits:
            cpu: '1'
            memory: 2Gi
            ephemeral-storage: 2Gi
        volumeMounts:
        - name: runtime
          mountPath: /app/var/raw-snapshots
          subPath: raw-snapshots
          readOnly: true
        - name: runtime
          mountPath: /app/var/datasets
          subPath: datasets
        - name: runtime
          mountPath: /app/var/executions
          subPath: executions
        - name: private
          mountPath: /run/private
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: runtime
        persistentVolumeClaim:
          claimName: ml-runtime
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: foundation
        configMap:
          name: ml-foundation-files
          defaultMode: 292
      - name: ca-source
        configMap:
          name: mlflow-ca
          defaultMode: 292
      - name: dataset-build-source
        secret:
          secretName: ml-runtime-dataset-build-worker
          defaultMode: 292
      - name: private
        emptyDir:
          medium: Memory
          sizeLimit: 2Mi
