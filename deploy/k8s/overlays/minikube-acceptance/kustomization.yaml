apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../minikube-training
- ../../dataset-build
patches:
- path: dataset-build-identity.yaml
configMapGenerator:
- name: ml-runtime
  behavior: merge
  literals:
  - ML_TRAINING_TIMEOUT_SECONDS=60
  - ML_QUEUE_TIMEOUT_SECONDS=10
  - ML_CANCEL_GRACE_SECONDS=1
  - 'ML_EBM_QUALITY_POLICY_JSON={"policy_version":"engineering-test-only-k8s-acceptance-v1","max_anchor_loss":1000000.0,"minimum_lot_correlation":-1.0,"minimum_lots":2}'
generatorOptions:
  disableNameSuffixHash: true
