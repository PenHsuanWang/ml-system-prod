apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-control
spec:
  template:
    spec:
      containers:
      - name: control
        volumeMounts:
        - name: kubernetes-api
          mountPath: /run/kubernetes
          readOnly: true
      volumes:
      - name: kubernetes-api
        projected:
          defaultMode: 288
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
