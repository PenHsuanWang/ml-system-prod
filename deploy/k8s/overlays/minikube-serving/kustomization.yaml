apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../minikube
- rbac.yaml
patches:
- path: control-api.yaml
configMapGenerator:
- name: ml-runtime
  behavior: merge
  literals:
  - ML_SERVING_BACKEND=kubernetes
  - ML_SERVING_NAMESPACE=ml-k8s-foundation
  - ML_SERVING_IMAGE_REPOSITORY=REPLACE_WITH_IMAGE_REPOSITORY
generatorOptions:
  disableNameSuffixHash: true
