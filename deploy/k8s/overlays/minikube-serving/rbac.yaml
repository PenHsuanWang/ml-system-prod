apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-serving
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ml-serving-controller
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - create
  - delete
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - configmaps
  - services
  verbs:
  - get
  - create
  - delete
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ml-serving-controller
subjects:
- kind: ServiceAccount
  name: ml-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ml-serving-controller
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: serving-controller-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ml-control
  policyTypes:
  - Egress
  egress:
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 8443
