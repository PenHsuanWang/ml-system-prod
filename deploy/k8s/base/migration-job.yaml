# Git-managed declaration; credentials are supplied outside Git.
apiVersion: batch/v1
kind: Job
metadata:
  name: ml-migrate
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ml-migrate
        ml-system/stage: migration
    spec:
      serviceAccountName: ml-migrate
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 360
      initContainers:
      - name: prepare-migrate
        image: ml-system-runtime:unconfigured
        imagePullPolicy: IfNotPresent
        command:
        - python
        - /foundation/prepare_runtime.py
        args: []
        envFrom:
        - configMapRef:
            name: ml-runtime
        env:
        - name: ML_RUNTIME_ROLE
          value: migrate
        - name: ML_WAIT_FOR_SCHEMA
          value: 'false'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: runtime
          mountPath: /app/var
        - name: foundation
          mountPath: /foundation
          readOnly: true
        - name: migrate-source
          mountPath: /projected/role
          readOnly: true
        - name: ca-source
          mountPath: /projected/ca
          readOnly: true
        - name: migrate-private
          mountPath: /run/private
        - name: tmp
          mountPath: /tmp
      containers:
      - name: migrate
        image: ml-system-runtime:unconfigured
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - bootstrap.deployment_entrypoint
        args:
        - python
        - -m
        - bootstrap.ml_cli
        - migrate
        envFrom:
        - configMapRef:
            name: ml-runtime
        env:
        - name: ML_RUNTIME_ROLE
          value: migrate
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: runtime
          mountPath: /app/var
        - name: migrate-private
          mountPath: /run/private
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: runtime
        persistentVolumeClaim:
          claimName: ml-runtime
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: foundation
        configMap:
          name: ml-foundation-files
          defaultMode: 292
      - name: ca-source
        configMap:
          name: mlflow-ca
          defaultMode: 292
      - name: migrate-source
        secret:
          secretName: ml-runtime-migrate
          defaultMode: 292
      - name: migrate-private
        emptyDir:
          medium: Memory
          sizeLimit: 2Mi
      restartPolicy: Never
