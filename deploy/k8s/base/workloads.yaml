# Git-managed declaration; credentials are supplied outside Git.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-management
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ml-management
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ml-management
        app.kubernetes.io/part-of: ml-system
        ml-system/stage: runtime
    spec:
      serviceAccountName: ml-management
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 360
      initContainers:
      - name: prepare-management
        image: ml-system-runtime:unconfigured
        imagePullPolicy: IfNotPresent
        command:
        - python
        - /foundation/prepare_runtime.py
        args: []
        envFrom:
        - configMapRef:
            name: ml-runtime
        env:
        - name: ML_RUNTIME_ROLE
          value: management
        - name: ML_WAIT_FOR_SCHEMA
          value: 'true'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: runtime
          mountPath: /app/var
        - name: foundation
          mountPath: /foundation
          readOnly: true
        - name: management-source
          mountPath: /projected/role
          readOnly: true
        - name: ca-source
          mountPath: /projected/ca
          readOnly: true
        - name: management-private
          mountPath: /run/private
        - name: tmp
          mountPath: /tmp
      containers:
      - name: management
        image: ml-system-runtime:unconfigured
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - bootstrap.deployment_entrypoint
        args:
        - uvicorn
        - bootstrap.ml_api:create_app
        - --factory
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --limit-concurrency
        - '64'
        envFrom:
        - configMapRef:
            name: ml-runtime
        env:
        - name: ML_RUNTIME_ROLE
          value: management
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
            ephemeral-storage: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
            ephemeral-storage: 2Gi
        volumeMounts:
        - name: runtime
          mountPath: /app/var
        - name: management-private
          mountPath: /run/private
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: artifact-cache
          mountPath: /app/var/artifacts
        ports:
        - name: http
          containerPort: 8000
        startupProbe:
          httpGet:
            path: /health/live
            port: 8000
          periodSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: runtime
        persistentVolumeClaim:
          claimName: ml-runtime
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: foundation
        configMap:
          name: ml-foundation-files
          defaultMode: 292
      - name: ca-source
        configMap:
          name: mlflow-ca
          defaultMode: 292
      - name: management-source
        secret:
          secretName: ml-runtime-management
          defaultMode: 292
      - name: management-private
        emptyDir:
          medium: Memory
          sizeLimit: 2Mi
      - name: artifact-cache
        emptyDir:
          sizeLimit: 1Gi
---
