# Git-managed declaration; credentials are supplied outside Git.
apiVersion: v1
kind: Service
metadata:
  name: ml-management
spec:
  selector:
    app.kubernetes.io/name: ml-management
  ports:
  - name: http
    port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ml-gateway
spec:
  selector:
    app.kubernetes.io/name: ml-control
  ports:
  - name: http
    port: 8001
    targetPort: 8001
