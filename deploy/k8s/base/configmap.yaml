# Git-managed declaration; credentials are supplied outside Git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-runtime
data:
  ML_RUNTIME_CONFIG_FILE: /run/private/config/runtime.json
  ML_MODEL_ENVIRONMENT: prod
  ML_TRACKER_BACKEND: mlflow
  ML_TRACKING_URI: https://mlflow:8443
  MLFLOW_TRACKING_URI: https://mlflow:8443
  MLFLOW_TRACKING_SERVER_CERT_PATH: /run/private/config/mlflow-ca.pem
  MLFLOW_TRACKING_INSECURE_TLS: 'false'
  MLFLOW_HTTP_REQUEST_TIMEOUT: '5'
  MLFLOW_HTTP_REQUEST_MAX_RETRIES: '1'
  ML_CODE_REVISION: REPLACE_WITH_RELEASE_COMMIT
  ML_IMAGE_DIGEST: REPLACE_WITH_MANIFEST_DIGEST
  ML_ARTIFACT_ROOT: /app/var/artifacts
  ML_DATASET_ROOT: /app/var/datasets
  ML_EXECUTION_ROOT: /app/var/executions
  ML_QUEUE_NAME: ml.training.v1
  ML_TRAINING_TIMEOUT_SECONDS: '300'
  ML_QUEUE_TIMEOUT_SECONDS: '600'
  ML_CANCEL_GRACE_SECONDS: '5'
  ML_HEARTBEAT_SECONDS: '2'
  ML_STALE_AFTER_SECONDS: '15'
  ML_IDEMPOTENCY_RETENTION_SECONDS: '86400'
  ML_MAX_PENDING_JOBS_PER_TENANT: '100'
  ML_ACK_TIMEOUT_MS: '1800000'
  APP_ENVIRONMENT: production
  APP_TASK_BACKEND: disabled
  APP_IDENTITY_ENABLED: 'true'
  APP_MONGO_ENABLED: 'true'
  APP_MONGO_DATABASE: backend
  ML_INGESTION_ENABLED: 'true'
  ML_DATABRICKS_ENABLED: 'false'
  ML_RAW_SNAPSHOT_ROOT: /app/var/raw-snapshots
  ML_INGESTION_FILE_ROOTS_JSON: '{}'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
