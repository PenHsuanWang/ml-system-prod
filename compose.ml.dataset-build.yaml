# Opt-in DatasetBuilder worker with read-only Raw Snapshots and shared dataset storage.
services:
  dataset-build-worker:
    profiles: [dataset-build]
    build: {context: ., dockerfile: Dockerfile.ml, target: ebm}
    user: ${ML_UID:-1000}:${ML_GID:-1000}
    command: [python, -m, bootstrap.dataset_build_worker]
    environment:
      ML_DATABASE_URL: postgresql+psycopg://ml:${ML_DB_PASSWORD:?set ML_DB_PASSWORD}@postgres:5432/ml
      APP_MONGO_URI: mongodb://root:${ML_MONGO_PASSWORD:?set ML_MONGO_PASSWORD}@mongo:27017/?authSource=admin
      APP_MONGO_DATABASE: backend
      ML_DATASET_ROOT: /app/var/datasets
      ML_EXECUTION_ROOT: /app/var/executions
      ML_RAW_SNAPSHOT_ROOT: /app/var/raw-snapshots
    volumes:
      - ./var/datasets:/app/var/datasets
      - ./var/executions:/app/var/executions
      - ./var/raw-snapshots:/app/var/raw-snapshots:ro
    depends_on:
      migrate: {condition: service_completed_successfully}
      mongo: {condition: service_healthy}
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 1
    pids_limit: 128
    stop_grace_period: 45s
